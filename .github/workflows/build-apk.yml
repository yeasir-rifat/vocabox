name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # gradle-wrapper.jar repo-তে নেই, তাই Gradle 8.9 সরাসরি ইনস্টল হচ্ছে
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download fonts (DM Sans, Noto Serif Bengali)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/download_fonts.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vocabox-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # Unsigned release build, only to prove that R8 shrinking does not break the app.
      - name: Verify release (R8) build
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Vocabox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ঐচ্ছিক: GitHub Secrets সেট করা থাকলে signed release APK বানাবে
      - name: Check signing secrets
        id: signing
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > vocabulary.jks
          cat > keystore.properties <<PROPS
          storeFile=vocabulary.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          gradle :app:assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Vocabox-release-apk
          path: app/build/outputs/apk/release/*.apk
